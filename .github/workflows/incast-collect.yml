name: Incast study, combined table

# Gathers the shard results of several runs of incast.yml into one table,
# so stages that ran in separate dispatches are read together. A run key
# names one profile and seed, so a key present in two runs is the same
# experiment; the later run's copy wins.
on:
  workflow_dispatch:
    inputs:
      run_ids:
        description: Space-separated run ids of incast.yml, oldest first
        required: true
        type: string

permissions:
  contents: write
  actions: read

jobs:
  collect:
    name: Combine and archive
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Download every run's profiles and results
      env:
        GH_TOKEN: ${{ github.token }}
        RUN_IDS: ${{ inputs.run_ids }}
      run: |
        set -euo pipefail
        mkdir -p combined/results combined/profiles
        for run in $RUN_IDS; do
          mkdir -p "runs/$run"
          gh run download "$run" --repo "$GITHUB_REPOSITORY" --dir "runs/$run" \
            --pattern "incast-results-$run-*" --pattern "incast-profiles-$run" || true
          for shard in runs/"$run"/incast-results-*; do
            [[ -d "$shard" ]] && cp -a "$shard"/. combined/results/
          done
          if [[ -d "runs/$run/incast-profiles-$run" ]]; then
            for listing in runs/"$run"/incast-profiles-"$run"/*/runs.json; do
              stage="$(basename "$(dirname "$listing")")"
              mkdir -p "combined/profiles/$stage"
              cp -a "$(dirname "$listing")"/. "combined/profiles/$stage/"
              cp "$listing" "combined/profiles/$stage/runs-$run.json"
            done
          fi
        done
        rm -rf runs

    - name: Tabulate
      run: |
        set -euo pipefail
        # One entry per key: later runs replace earlier ones.
        jq -s 'add | reduce .[] as $r ({}; .[$r.key] = $r) | [.[]]' \
          combined/profiles/*/runs-*.json > combined/results/runs.json
        python3 incast/analyze.py compare --runs combined/results/runs.json \
          --out-root combined/results > combined/results/table.json
        python3 incast/report.py combined/results/table.json > combined/results/report.md
        # Cost against the paired healthy runs, for the transient stages.
        python3 incast/analyze.py cost --runs combined/results/runs.json \
          --out-root combined/results --reference graded_per_connection > combined/results/cost.json
        cat combined/results/report.md >> "$GITHUB_STEP_SUMMARY"

    # The tables and every run's summary, windows and link error drops, and
    # the sender loss, receiver hold and retransmission timeout traces the
    # a2a_candidates measures read, small enough to read anywhere; the full
    # bundle below also carries the per-report files.
    - name: Keep the tables and summaries as an artifact
      uses: actions/upload-artifact@v7
      with:
        name: incast-tables-${{ github.run_id }}
        path: |
          combined/results/table.json
          combined/results/report.md
          combined/results/cost.json
          combined/results/runs.json
          combined/results/*/summary.json
          combined/results/*/transients.json
          combined/results/*/spine_windows.csv
          combined/results/*/offered_windows.csv
          combined/results/*/link_error_drops.csv
          combined/results/*/ns3/spine_losses.csv
          combined/results/*/ns3/receiver_holds.csv
          combined/results/*/ns3/rto_events.csv
        retention-days: 90

    - name: Keep the combined table as an artifact
      uses: actions/upload-artifact@v7
      with:
        name: incast-combined-${{ github.run_id }}
        path: combined
        retention-days: 90

    # Best-effort: the artifact above is the copy that always exists.
    - name: Archive on a release
      continue-on-error: true
      env:
        GH_TOKEN: ${{ github.token }}
        RUN_IDS: ${{ inputs.run_ids }}
      run: |
        set -euo pipefail
        tag="incast-combined-${GITHUB_RUN_ID}"
        tar -czf "$tag.tar.gz" -C combined results profiles
        gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
          --title "Incast study, combined: runs ${RUN_IDS}" \
          --notes-file combined/results/report.md \
          "$tag.tar.gz" combined/results/table.json combined/results/report.md
