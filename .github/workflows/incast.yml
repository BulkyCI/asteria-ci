name: Incast load-balancing study

# One dispatch runs one or more stages of incast/profiles.py: the plan job
# writes the stage's profiles, a hosted job builds (or restores) the ns-3
# runtime of the pinned asteria commit, and every shard of runs gets its own
# just-in-time runner on the DCS cluster (or a hosted runner). The collect
# job tabulates what the shards return and archives it on a release.
on:
  workflow_dispatch:
    inputs:
      stages:
        description: Comma-separated stages of incast/profiles.py (binding, calibration, gain, tuning, comparison, kill, edge, short, t_calibration, t_tuning, t_comparison, a2a_probe, a2a_oracle_calibration, a2a_gate, a2a_calibration, a2a_tuning, a2a_tuning_mix, a2a_comparison, a2a_gate_reps, a2a_candidates, a2a_receiver, a2a_rs3, a2a_tail, a2a_ackloss, a2a_candidates_ack, a2a_tail_ack, a2a_probe_4k, a2a_calibration_4k, a2a_tail_ack_4k, a2a_sweep_4k, a2a_downlink_4k, a2a_decode_probe_4k, a2a_decode_calibration_4k, a2a_decode_4k, a2a_reaction_4k, ar_parity_probe_4k, ar_parity_calibration_4k, ar_parity_4k, a2a_ackroute_4k, a2a_noack_4k, a2a_hostlink_4k, a2a_ackroute_fwd_4k, a2a_downlink_spray_4k, a2a_twoend_4k, a2a_hostlink_s_4k, a2a_twoend_base_4k, a2a_twoend_retract_4k, a2a_overdue_4k, a2a_spines<P>_probe_4k and a2a_spines<P>_calibration_4k for P in 8, 32, 128, 256, a2a_wide<P>_calibration_4k and a2a_wide<P>_4k for P in 8, 32, 128, 256, a2a_wide<P>_validity_4k for P in 32, 128, 256)
        required: true
        type: string
      record_filter:
        description: Regular expression on run keys; empty runs every run of the stages
        required: false
        default: ""
        type: string
      runs_per_shard:
        description: Runs per runner
        required: false
        default: 2
        type: number
      runner:
        description: Where the shards run
        required: false
        default: dcs
        type: choice
        options: [ dcs, hosted ]
      simulation_timeout_seconds:
        description: Seconds one simulation may run before run.py stops it
        required: false
        default: 21600
        type: number
      run_timeout_minutes:
        description: Minutes a shard's job may run
        required: false
        default: 720
        type: number
      collect_timeout_minutes:
        description: Minutes the tabulating job may run
        required: false
        default: 60
        type: number
      max_parallel:
        description: Shards provisioned and run at once
        required: false
        default: 64
        type: number

permissions:
  contents: read

concurrency:
  # Every dispatch is an independent experiment whose record must survive.
  group: incast-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  plan:
    name: Plan the runs
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
      asteria_ref: ${{ steps.plan.outputs.asteria_ref }}
      parallel: ${{ steps.plan.outputs.parallel }}
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Write the profiles and split the runs into shards
      id: plan
      env:
        STAGES: ${{ inputs.stages }}
        RECORD_FILTER: ${{ inputs.record_filter }}
        RUNS_PER_SHARD: ${{ inputs.runs_per_shard }}
        RUNNER_KIND: ${{ inputs.runner }}
      run: |
        set -euo pipefail
        args=()
        [[ -f incast/calibration.json ]] && args+=(--calibration incast/calibration.json)
        [[ -f incast/tuning.json ]] && args+=(--tuning incast/tuning.json)
        [[ -f incast/transient_calibration.json ]] && args+=(--transient-calibration incast/transient_calibration.json)
        [[ -f incast/transient_tuning.json ]] && args+=(--transient-tuning incast/transient_tuning.json)
        [[ -f incast/a2a_calibration.json ]] && args+=(--a2a-calibration incast/a2a_calibration.json)
        [[ -f incast/a2a_tuning.json ]] && args+=(--a2a-tuning incast/a2a_tuning.json)
        IFS=, read -ra stages <<< "$STAGES"
        for stage in "${stages[@]}"; do
          python3 incast/profiles.py write --out "profiles/$stage" --stage "$stage" "${args[@]}"
        done
        python3 incast/shards.py profiles --filter "$RECORD_FILTER" \
          --runs-per-shard "$RUNS_PER_SHARD" --out profiles/shards.json
        {
          echo "shards=$(cat profiles/shards.json)"
          echo "asteria_ref=$(tr -d '[:space:]' < incast/asteria.ref)"
          # Two cores per DCS allocation, four on a hosted runner; the
          # simulator is single-threaded.
          if [[ "$RUNNER_KIND" == dcs ]]; then echo "parallel=2"; else echo "parallel=4"; fi
        } >> "$GITHUB_OUTPUT"
        jq -r '"\(length) shards, \([.[].keys | split(" ") | length] | add) runs"' profiles/shards.json

    - uses: actions/upload-artifact@v7
      with:
        name: incast-profiles-${{ github.run_id }}
        path: profiles
        if-no-files-found: error

  build:
    name: Build the ns-3 runtime
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
    - name: Restore the runtime of this asteria commit
      id: bundle
      uses: actions/cache/restore@v6
      with:
        path: ${{ runner.temp }}/cluster-runtime-x86-64-v3.tar.gz
        key: incast-runtime-v1-${{ needs.plan.outputs.asteria_ref }}

    - name: Check out asteria and its submodules
      if: ${{ steps.bundle.outputs.cache-hit != 'true' }}
      uses: actions/checkout@v7
      with:
        repository: caddyreverse/asteria
        ref: ${{ needs.plan.outputs.asteria_ref }}
        path: asteria
        submodules: recursive
        persist-credentials: false

    - name: Restore the compiler cache
      if: ${{ steps.bundle.outputs.cache-hit != 'true' }}
      uses: actions/cache@v6
      with:
        path: ${{ runner.temp }}/ccache
        key: incast-ccache-v1-${{ needs.plan.outputs.asteria_ref }}
        restore-keys: incast-ccache-v1-

    # x86-64-v3 runs on every node the sbatch constraint admits and on
    # hosted runners, so one bundle serves both.
    - name: Build the x86-64-v3 runtime bundle
      if: ${{ steps.bundle.outputs.cache-hit != 'true' }}
      working-directory: asteria
      env:
        CCACHE_DIR: ${{ runner.temp }}/ccache
      run: bash ci/dcs/build.sh x86-64-v3

    - name: Save the runtime of this asteria commit
      if: ${{ steps.bundle.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@v6
      with:
        path: ${{ runner.temp }}/cluster-runtime-x86-64-v3.tar.gz
        key: incast-runtime-v1-${{ needs.plan.outputs.asteria_ref }}

    - uses: actions/upload-artifact@v7
      with:
        name: incast-runtime-${{ github.run_id }}
        path: ${{ runner.temp }}/cluster-runtime-x86-64-v3.tar.gz
        compression-level: 0
        retention-days: 7
        if-no-files-found: error

  provision:
    name: Provision a cluster runner
    needs: [ plan, build ]
    if: ${{ inputs.runner == 'dcs' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Authenticates with repository secrets, not the workflow token.
    permissions: {}
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.max_parallel) }}
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
        sparse-checkout: .github/actions/dcs-provision
        sparse-checkout-cone-mode: false

    - uses: ./.github/actions/dcs-provision
      with:
        runner-name: dcs-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard.id }}
        run-label: dcs-r${{ github.run_id }}-${{ matrix.shard.id }}
        app-id: ${{ vars.DCS_APP_ID }}
        app-private-key: ${{ secrets.DCS_APP_PRIVATE_KEY }}
        ssh-key: ${{ secrets.DCS_SSH_KEY }}
        ssh-dest: ${{ vars.DCS_SSH_DEST }}
        ssh-host-key: ${{ vars.DCS_SSH_HOST_KEY }}

  run:
    name: Run a shard
    needs: [ plan, build, provision ]
    if: ${{ !cancelled() && needs.build.result == 'success' && (needs.provision.result == 'success' || needs.provision.result == 'skipped') }}
    runs-on: ${{ inputs.runner == 'dcs' && format('dcs-r{0}-{1}', github.run_id, matrix.shard.id) || 'ubuntu-24.04' }}
    timeout-minutes: ${{ fromJSON(inputs.run_timeout_minutes) }}
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.max_parallel) }}
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    env:
      ASTERIA: ${{ github.workspace }}/asteria
    steps:
    # A hosted runner's disk is shared by four concurrent runs whose event
    # streams reach a few GB each before they are reduced; the preinstalled
    # toolchains this study never uses free about 25 GB.
    - name: Free disk on a hosted runner
      if: ${{ inputs.runner == 'hosted' }}
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        df -h "$GITHUB_WORKSPACE"

    - name: Check out the study
      uses: actions/checkout@v7
      with:
        path: study
        persist-credentials: false

    - name: Check out asteria
      uses: actions/checkout@v7
      with:
        repository: caddyreverse/asteria
        ref: ${{ needs.plan.outputs.asteria_ref }}
        path: asteria
        submodules: false
        persist-credentials: false

    - uses: actions/download-artifact@v8
      with:
        name: incast-runtime-${{ github.run_id }}
        path: asteria

    - uses: actions/download-artifact@v8
      with:
        name: incast-profiles-${{ github.run_id }}
        path: profiles

    - name: Install and verify the runtime
      working-directory: asteria
      run: bash ci/dcs/install-runtime.sh cluster-runtime-x86-64-v3.tar.gz

    - name: Install pinned uv
      uses: astral-sh/setup-uv@v9.0.0
      with:
        version: "0.11.28"
        enable-cache: false

    - name: Synchronize the locked Python environment
      working-directory: asteria
      run: uv sync --locked

    - name: Run the shard
      env:
        KEYS: ${{ matrix.shard.keys }}
        PARALLEL: ${{ needs.plan.outputs.parallel }}
        SIMULATION_TIMEOUT_SECONDS: ${{ inputs.simulation_timeout_seconds }}
        # Scoped to this step: the runtime's libraries would shadow the
        # system's for every later step's tooling.
        LD_LIBRARY_PATH: ${{ env.ASTRA_SIM_LD_LIBRARY_PATH }}
      run: |
        set -uo pipefail
        mkdir -p results
        for key in $KEYS; do
          stage="${key%%-*}"
          printf '%s %s\n' "profiles/$stage" "$key"
        done | xargs -P "$PARALLEL" -L 1 sh -c \
          'bash study/incast/run_one.sh "$0" "$1" results' \
          | tee results/shard-${{ matrix.shard.id }}.txt
        echo "--- $(grep -c 'status 0,' results/shard-${{ matrix.shard.id }}.txt) of $(wc -w <<< "$KEYS") runs completed cleanly"

    - name: Upload the shard's results
      if: ${{ always() }}
      uses: actions/upload-artifact@v7
      with:
        name: incast-results-${{ github.run_id }}-${{ matrix.shard.id }}
        path: results
        if-no-files-found: ignore
        retention-days: 30

  collect:
    name: Tabulate and archive
    needs: [ plan, run ]
    if: ${{ always() && needs.plan.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ fromJSON(inputs.collect_timeout_minutes) }}
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false

    - uses: actions/download-artifact@v8
      with:
        pattern: incast-results-${{ github.run_id }}-*
        path: results
        merge-multiple: true

    - uses: actions/download-artifact@v8
      with:
        name: incast-profiles-${{ github.run_id }}
        path: profiles

    - name: Tabulate
      env:
        STAGES: ${{ inputs.stages }}
      run: |
        set -euo pipefail
        mkdir -p results
        jq -s 'add' profiles/*/runs.json > results/runs.json
        python3 incast/analyze.py compare --runs results/runs.json --out-root results > results/table.json
        python3 incast/report.py results/table.json > results/report.md
        # Cost against the paired healthy runs, for the transient stages.
        python3 incast/analyze.py cost --runs results/runs.json --out-root results \
          --reference graded_per_connection > results/cost.json
        cat results/report.md >> "$GITHUB_STEP_SUMMARY"
        if [[ ",${STAGES// /}," == *,a2a_gate_reps,* ]]; then
          python3 incast/analyze.py a2a_gate_reps --runs results/runs.json --out-root results \
            --markdown results/a2a_gate_reps.md > results/a2a_gate_reps.json
          cat results/a2a_gate_reps.md >> "$GITHUB_STEP_SUMMARY"
        fi
        for stage in a2a_candidates a2a_receiver a2a_tail a2a_ackloss a2a_candidates_ack a2a_tail_ack a2a_tail_ack_4k \
            a2a_sweep_4k a2a_decode_4k ar_parity_4k a2a_ackroute_4k a2a_noack_4k a2a_hostlink_4k a2a_ackroute_fwd_4k \
            a2a_downlink_spray_4k a2a_twoend_4k a2a_hostlink_s_4k a2a_twoend_base_4k; do
          if [[ ",${STAGES// /}," == *,$stage,* ]]; then
            python3 incast/analyze.py a2a_candidates --runs results/runs.json --out-root results \
              --stage "$stage" --markdown "results/$stage.md" > "results/$stage.json"
            cat "results/$stage.md" >> "$GITHUB_STEP_SUMMARY"
          fi
        done
        # Evidence, R and the hold arms' gaps per cell, for the stages that
        # run the 4096-byte arms. a2a_sweep_4k's table here lacks the cells
        # whose runs it takes from a2a_tail_ack_4k, and the costs of those
        # it pairs with that stage's healthy runs: analyze.py a2a_sweep
        # --shared-root with the directory that dispatch tabulated adds them.
        for stage in a2a_tail_ack_4k a2a_sweep_4k a2a_decode_4k; do
          if [[ ",${STAGES// /}," == *,$stage,* ]]; then
            python3 incast/analyze.py a2a_sweep --runs results/runs.json --out-root results \
              --stage "$stage" --markdown "results/${stage}_cells.md" > "results/${stage}_cells.json"
            cat "results/${stage}_cells.md" >> "$GITHUB_STEP_SUMMARY"
          fi
        done
        if [[ ",${STAGES// /}," == *,a2a_reaction_4k,* ]]; then
          python3 incast/analyze.py a2a_reaction --runs results/runs.json --out-root results \
            --stage a2a_reaction_4k --markdown results/a2a_reaction_4k.md > results/a2a_reaction_4k.json
          cat results/a2a_reaction_4k.md >> "$GITHUB_STEP_SUMMARY"
        fi
        if [[ ",${STAGES// /}," == *,a2a_downlink_4k,* ]]; then
          python3 incast/analyze.py a2a_downlink --runs results/runs.json --out-root results \
            --stage a2a_downlink_4k --markdown results/a2a_downlink_4k.md > results/a2a_downlink_4k.json
          cat results/a2a_downlink_4k.md >> "$GITHUB_STEP_SUMMARY"
        fi
        # Correct and false sender holds by the answers' routing, and the
        # answers lost per spine and direction.
        if [[ ",${STAGES// /}," == *,a2a_ackroute_4k,* ]]; then
          python3 incast/analyze.py a2a_ackroute --runs results/runs.json --out-root results \
            --stage a2a_ackroute_4k --markdown results/a2a_ackroute_4k_holds.md > results/a2a_ackroute_4k_holds.json
          cat results/a2a_ackroute_4k_holds.md >> "$GITHUB_STEP_SUMMARY"
        fi
        # The forward oracle's arms, with a2a_ackroute_4k's runs in each cell
        # when this dispatch ran that stage too; analyze.py a2a_ackroute
        # --with-root with the directory its dispatch tabulated adds them
        # otherwise.
        if [[ ",${STAGES// /}," == *,a2a_ackroute_fwd_4k,* ]]; then
          with=()
          if [[ ",${STAGES// /}," == *,a2a_ackroute_4k,* ]]; then
            with=(--with-root results)
          fi
          python3 incast/analyze.py a2a_ackroute --runs results/runs.json --out-root results \
            --stage a2a_ackroute_fwd_4k "${with[@]}" --markdown results/a2a_ackroute_fwd_4k_holds.md \
            > results/a2a_ackroute_fwd_4k_holds.json
          cat results/a2a_ackroute_fwd_4k_holds.md >> "$GITHUB_STEP_SUMMARY"
        fi
        # Each loss-hold arm without ack_loss_rtts; its ack arm's costs join
        # when analyze.py a2a_noack is given those stages' tabulated roots.
        if [[ ",${STAGES// /}," == *,a2a_noack_4k,* ]]; then
          python3 incast/analyze.py a2a_noack --runs results/runs.json --out-root results \
            --stage a2a_noack_4k --markdown results/a2a_noack_4k_ack.md > results/a2a_noack_4k_ack.json
          cat results/a2a_noack_4k_ack.md >> "$GITHUB_STEP_SUMMARY"
        fi
        # Each end's first hold of the downlink under sprayed answers, the
        # losses before it, the receiver's tail counts and both ends' correct
        # and false holds.
        if [[ ",${STAGES// /}," == *,a2a_downlink_spray_4k,* ]]; then
          python3 incast/analyze.py a2a_downlink_spray --runs results/runs.json --out-root results \
            --stage a2a_downlink_spray_4k --markdown results/a2a_downlink_spray_4k_holds.md \
            > results/a2a_downlink_spray_4k_holds.json
          cat results/a2a_downlink_spray_4k_holds.md >> "$GITHUB_STEP_SUMMARY"
        fi
        # The answer losses the senders counted, their holds read under
        # sprayed answers, and both ends' holds of the answers' routes.
        if [[ ",${STAGES// /}," == *,a2a_twoend_4k,* ]]; then
          python3 incast/analyze.py a2a_twoend --runs results/runs.json --out-root results \
            --stage a2a_twoend_4k --markdown results/a2a_twoend_4k_answers.md > results/a2a_twoend_4k_answers.json
          cat results/a2a_twoend_4k_answers.md >> "$GITHUB_STEP_SUMMARY"
        fi
        # The per-connection answer routes, with a2a_twoend_4k's runs in each
        # cell when this dispatch ran that stage too; analyze.py a2a_twoend
        # --with-root with the directory its dispatch tabulated adds them
        # otherwise.
        if [[ ",${STAGES// /}," == *,a2a_twoend_base_4k,* ]]; then
          with=()
          if [[ ",${STAGES// /}," == *,a2a_twoend_4k,* ]]; then
            with=(--with-root results)
          fi
          python3 incast/analyze.py a2a_twoend --runs results/runs.json --out-root results \
            --stage a2a_twoend_base_4k "${with[@]}" --markdown results/a2a_twoend_base_4k_answers.md \
            > results/a2a_twoend_base_4k_answers.json
          cat results/a2a_twoend_base_4k_answers.md >> "$GITHUB_STEP_SUMMARY"
        fi
        # The timed-out sends' losses taken back at a flagged answer, beside
        # the stage's own coverage-first arms.
        if [[ ",${STAGES// /}," == *,a2a_twoend_retract_4k,* ]]; then
          python3 incast/analyze.py a2a_twoend --runs results/runs.json --out-root results \
            --stage a2a_twoend_retract_4k --markdown results/a2a_twoend_retract_4k_answers.md \
            > results/a2a_twoend_retract_4k_answers.json
          cat results/a2a_twoend_retract_4k_answers.md >> "$GITHUB_STEP_SUMMARY"
        fi
        # Each arm with the overdue repair, with its key-off arm's runs in each
        # cell when this dispatch ran a2a_twoend_4k, a2a_twoend_base_4k or
        # a2a_twoend_retract_4k too; analyze.py a2a_overdue --with with the
        # directories their dispatches tabulated adds them otherwise.
        if [[ ",${STAGES// /}," == *,a2a_overdue_4k,* ]]; then
          with=()
          for stage in a2a_twoend_4k a2a_twoend_base_4k a2a_twoend_retract_4k; do
            if [[ ",${STAGES// /}," == *,$stage,* ]]; then
              with+=(--with results "$stage")
            fi
          done
          python3 incast/analyze.py a2a_overdue --runs results/runs.json --out-root results \
            --stage a2a_overdue_4k "${with[@]}" --markdown results/a2a_overdue_4k.md \
            > results/a2a_overdue_4k.json
          cat results/a2a_overdue_4k.md >> "$GITHUB_STEP_SUMMARY"
        fi
        # Under a lossy host access link every spine hold is false: where the
        # holds and the senders' losses fall.
        if [[ ",${STAGES// /}," == *,a2a_hostlink_4k,* ]]; then
          python3 incast/analyze.py a2a_hostlink --runs results/runs.json --out-root results \
            --stage a2a_hostlink_4k --markdown results/a2a_hostlink_4k_holds.md > results/a2a_hostlink_4k_holds.json
          cat results/a2a_hostlink_4k_holds.md >> "$GITHUB_STEP_SUMMARY"
        fi
        # The loss-hold arms with the sender's coverage first under the same
        # host links, with a2a_hostlink_4k's runs in each cell when this
        # dispatch ran that stage too; analyze.py a2a_hostlink --with-root
        # with the directories its dispatches tabulated adds them otherwise.
        if [[ ",${STAGES// /}," == *,a2a_hostlink_s_4k,* ]]; then
          with=()
          if [[ ",${STAGES// /}," == *,a2a_hostlink_4k,* ]]; then
            with=(--with-root results)
          fi
          python3 incast/analyze.py a2a_hostlink --runs results/runs.json --out-root results \
            --stage a2a_hostlink_s_4k "${with[@]}" --markdown results/a2a_hostlink_s_4k_holds.md \
            > results/a2a_hostlink_s_4k_holds.json
          cat results/a2a_hostlink_s_4k_holds.md >> "$GITHUB_STEP_SUMMARY"
        fi
        # Each wide-leaf comparison against reps_tail, with the sender holds
        # read against the run's failed links under sprayed answers.
        for wide in 8 32 128 256; do
          stage="a2a_wide${wide}_4k"
          if [[ ",${STAGES// /}," == *,$stage,* ]]; then
            python3 incast/analyze.py a2a_ackroute --runs results/runs.json --out-root results \
              --stage "$stage" --markdown "results/${stage}_holds.md" > "results/${stage}_holds.json"
            cat "results/${stage}_holds.md" >> "$GITHUB_STEP_SUMMARY"
          fi
        done
        # Each wide-leaf member's trims, spans against P = 8's, uplink load
        # and queues against their thresholds.
        for wide in 32 128 256; do
          stage="a2a_wide${wide}_validity_4k"
          if [[ ",${STAGES// /}," == *,$stage,* ]]; then
            python3 incast/analyze.py a2a_wide_validity --runs results/runs.json --out-root results \
              --stage "$stage" --markdown "results/$stage.md" > "results/$stage.json"
            cat "results/$stage.md" >> "$GITHUB_STEP_SUMMARY"
          fi
        done
        for stage in a2a_probe_4k a2a_decode_probe_4k a2a_spines8_probe_4k a2a_spines32_probe_4k \
            a2a_spines128_probe_4k a2a_spines256_probe_4k; do
          if [[ ",${STAGES// /}," == *,$stage,* ]]; then
            python3 incast/analyze.py a2a_compute_gaps --runs results/runs.json --out-root results \
              --stage "$stage" --markdown "results/$stage.md" > "results/$stage.json"
            cat "results/$stage.md" >> "$GITHUB_STEP_SUMMARY"
          fi
        done
        if [[ ",${STAGES// /}," == *,a2a_rs3,* ]]; then
          python3 incast/analyze.py a2a_candidates --runs results/runs.json --out-root results \
            --stage a2a_rs3 --markdown results/a2a_rs3.md > results/a2a_rs3.json
          python3 incast/analyze.py a2a_cycles --runs results/runs.json --out-root results \
            --stage a2a_rs3 --markdown results/a2a_rs3_cycles.md > results/a2a_rs3_cycles.json
          cat results/a2a_rs3.md results/a2a_rs3_cycles.md >> "$GITHUB_STEP_SUMMARY"
        fi

    # Best-effort: the artifacts above are the copy that always exists, and
    # a results tarball can exceed GitHub's 2 GiB asset limit.
    - name: Archive on a release
      continue-on-error: true
      env:
        GH_TOKEN: ${{ github.token }}
        STAGES: ${{ inputs.stages }}
      run: |
        set -euo pipefail
        tag="incast-${GITHUB_RUN_ID}"
        tar -czf "incast-${GITHUB_RUN_ID}.tar.gz" results profiles
        gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
          --title "Incast study: ${STAGES} (run ${GITHUB_RUN_ID})" \
          --notes-file results/report.md \
          "incast-${GITHUB_RUN_ID}.tar.gz" results/table.json results/report.md results/cost.json
